[package]
name = "hara-hta"
version = "0.1.19"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
description = "Dependency-free canonical HTA0 codec for portable Hara ABI values"
repository = "https://github.com/hara-lang/hara-native"
homepage = "https://www.hara-lang.org"
documentation = "https://docs.rs/hara-hta"
keywords = ["hara", "serialization", "abi", "codec"]
categories = ["encoding", "development-tools::ffi"]

[dependencies]
hara-abi = { version = "0.1.19", path = "../abi" }
