[package]
name = "hara-protocol-macros"
version = "0.1.26"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
description = "Protocol implementation macros for Hara Native"
repository = "https://github.com/hara-lang/hara-native"
homepage = "https://www.hara-lang.org"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
