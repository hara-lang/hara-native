name: Native release promotion

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: hara-native-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-ref:
    name: release ref
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Require the current release branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release
          git fetch origin main release --tags --force
          test "$(git rev-parse origin/release)" = "$GITHUB_SHA"
          # A one-time re-anchor may make release point directly at a main
          # commit. Ordinary promotions must retain a merge parent from main
          # so that future main-to-release pull requests remain conflict-free.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            parents="$(git show -s --format=%P "$GITHUB_SHA")"
            read -r -a parents <<<"$parents"
            test "${#parents[@]}" = 2
            # A normal promotion merge retains the previous release as its
            # first parent and the promoted main head as its second. Only the
            # latter must remain in the current main lineage.
            git merge-base --is-ancestor "${parents[1]}" origin/main
          fi
          version="$(jq -er '.version' release/version.json)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  preflight:
    needs: release-ref
    uses: ./.github/workflows/native-release-preflight.yml

  npm-publish-credential:
    name: npm publish credential
    needs: release-ref
    runs-on: ubuntu-22.04
    environment: packages
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Verify the npmjs publish identity before creating a release intent
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm whoami --registry https://registry.npmjs.org

  release-intent:
    name: release intent
    needs: [release-ref, preflight, npm-publish-credential]
    runs-on: ubuntu-22.04
    outputs:
      resuming: ${{ steps.intent.outputs.resuming }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: intent
        name: Create or verify the immutable release intent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-ref.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-ref.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch origin release --tags --force
          test "$(git rev-parse origin/release)" = "$RELEASE_COMMIT"
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
            git push origin "refs/tags/${RELEASE_TAG}"
            git fetch origin --tags --force
          fi
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
            printf 'resuming=true\n' >> "$GITHUB_OUTPUT"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "Hara Native ${RELEASE_VERSION}" \
              --notes "Release publication in progress for ${RELEASE_COMMIT}."
            printf 'resuming=false\n' >> "$GITHUB_OUTPUT"
          fi

  rust-cli:
    needs: [preflight, release-ref, release-intent]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-22.04
          - id: macos-x86_64
            os: macos-13
          - id: macos-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --manifest-path core/rust/Cargo.toml --release --bin hara-native
      - name: Archive the versioned CLI
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          mkdir -p dist
          tar -C core/rust/target/release -czf "dist/hara-native-${RELEASE_VERSION}-${{ matrix.id }}.tar.gz" hara-native
      - uses: actions/upload-artifact@v4
        with:
          name: hara-native-${{ matrix.id }}
          path: dist/hara-native-*.tar.gz
          if-no-files-found: error

  jvm:
    needs: [preflight, release-ref, release-intent]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the versioned JVM artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          set -euo pipefail
          mvn -q -f core/java/pom.xml -Djacoco.skip=true -DskipTests package
          mkdir -p dist
          cp "core/java/target/hara-native-jvm-${RELEASE_VERSION}.jar" "dist/hara-native-jvm-${RELEASE_VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: hara-native-jvm
          path: dist/hara-native-jvm-*.jar
          if-no-files-found: error

  browser:
    needs: [preflight, release-intent]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build and pack both public browser packages
        shell: bash
        run: |
          set -euo pipefail
          make build-browser-profiles
          mkdir -p core/rust/web/dist
          (cd core/rust/web/packages/browser && npm pack --pack-destination ../../dist)
          (cd core/rust/web/packages/hta && npm pack --pack-destination ../../dist)
      - uses: actions/upload-artifact@v4
        with:
          name: hara-native-browser
          path: core/rust/web/dist/*.tgz
          if-no-files-found: error

  publish-crates:
    needs: [release-ref, release-intent, preflight]
    runs-on: ubuntu-22.04
    environment: crates-io
    outputs:
      abi_sha256: ${{ steps.publish.outputs.abi_sha256 }}
      hta_sha256: ${{ steps.publish.outputs.hta_sha256 }}
      macros_sha256: ${{ steps.publish.outputs.macros_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: publish
        name: Publish or verify public Cargo packages in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          RESUMING: ${{ needs.release-intent.outputs.resuming }}
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"
          package_for_registry() {
            local manifest="$1" package="$2" version="$3" attempt
            for attempt in $(seq 1 30); do
              if cargo package --locked --manifest-path "$manifest" --allow-dirty --no-verify; then
                test -f "core/rust/target/package/${package}-${version}.crate"
                return 0
              fi
              if test "$attempt" = 30; then
                printf 'failed to package %s %s after crates.io index propagation\n' "$package" "$version" >&2
                return 1
              fi
              sleep 5
            done
          }
          check_packaged_manifest() {
            local package="$1" version="$2" archive manifest manifest_contents
            archive="core/rust/target/package/${package}-${version}.crate"
            manifest="$(tar -tzf "$archive" | grep '/Cargo.toml$')"
            manifest_contents="$(tar -xOf "$archive" "$manifest")"
            if grep -En '= \{[^}]*[[:space:],{](path|git)[[:space:]]*=' <<<"$manifest_contents"; then
              printf '%s contains a local or git dependency\n' "$package" >&2
              exit 1
            fi
          }
          crate_metadata() {
            local package="$1" version="$2" output status
            output="$(mktemp)"
            status="$(curl --silent --show-error --retry 5 --retry-all-errors \
              --header "Authorization: Bearer ${CARGO_REGISTRY_TOKEN}" \
              --header 'User-Agent: hara-native-release' \
              --output "$output" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${package}/${version}")" || {
                rm -f "$output"
                return 2
              }
            case "$status" in
              200) cat "$output" ;;
              404) rm -f "$output"; return 1 ;;
              *)
                rm -f "$output"
                printf 'crates.io metadata request for %s %s returned HTTP %s\n' "$package" "$version" "$status" >&2
                return 2
                ;;
            esac
            rm -f "$output"
          }
          wait_for_crate() {
            local package="$1" version="$2" metadata
            for _ in $(seq 1 30); do
              if metadata="$(crate_metadata "$package" "$version")"; then
                printf '%s' "$metadata"
                return 0
              fi
              test "$?" = 1 || return 1
              sleep 5
            done
            printf 'timed out waiting for %s %s on crates.io\n' "$package" "$version" >&2
            return 1
          }
          publish_or_resume() {
            local manifest="$1" package="$2" output="$3" version metadata checksum expected
            version="$(cargo metadata --manifest-path "$manifest" --no-deps --format-version 1 | jq -er --arg package "$package" '.packages[] | select(.name == $package) | .version')"
            package_for_registry "$manifest" "$package" "$version"
            check_packaged_manifest "$package" "$version"
            expected="$(sha256sum "core/rust/target/package/${package}-${version}.crate" | awk '{print $1}')"
            if metadata="$(crate_metadata "$package" "$version")"; then
              test "$RESUMING" = true
            else
              test "$?" = 1
              cargo publish --locked --manifest-path "$manifest"
              metadata="$(wait_for_crate "$package" "$version")"
            fi
            checksum="$(jq -er '.version.checksum' <<<"$metadata")"
            test "$checksum" = "$expected"
            printf '%s=%s\n' "$output" "$checksum" >> "$GITHUB_OUTPUT"
          }
          publish_or_resume core/rust/crates/abi/Cargo.toml hara-abi abi_sha256
          publish_or_resume core/rust/crates/hta-codec/Cargo.toml hara-hta hta_sha256
          publish_or_resume core/rust/crates/protocol-macros/Cargo.toml hara-protocol-macros macros_sha256

  root-crate-package:
    needs: [release-ref, publish-crates]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and inspect the root crate against crates.io dependencies
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if cargo package --locked --manifest-path core/rust/Cargo.toml --allow-dirty --no-verify; then
              break
            fi
            if test "$attempt" = 30; then
              printf 'failed to package hara-native %s after crates.io index propagation\n' "$RELEASE_VERSION" >&2
              exit 1
            fi
            sleep 5
          done
          manifest="$(tar -tzf "core/rust/target/package/hara-native-${RELEASE_VERSION}.crate" | grep '/Cargo.toml$')"
          manifest_contents="$(tar -xOf "core/rust/target/package/hara-native-${RELEASE_VERSION}.crate" "$manifest")"
          if grep -En '= \{[^}]*[[:space:],{](path|git)[[:space:]]*=' <<<"$manifest_contents"; then
            printf '%s contains a local or git dependency\n' "$manifest" >&2
            exit 1
          fi

  publish-native-crate:
    needs: [release-ref, release-intent, root-crate-package]
    runs-on: ubuntu-22.04
    environment: crates-io
    outputs:
      native_sha256: ${{ steps.publish.outputs.native_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: publish
        name: Publish or verify the root Cargo package
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          RESUMING: ${{ needs.release-intent.outputs.resuming }}
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"
          package_for_registry() {
            local attempt
            for attempt in $(seq 1 30); do
              if cargo package --locked --manifest-path core/rust/Cargo.toml --allow-dirty --no-verify; then
                return 0
              fi
              if test "$attempt" = 30; then
                printf 'failed to package hara-native %s after crates.io index propagation\n' "$RELEASE_VERSION" >&2
                return 1
              fi
              sleep 5
            done
          }
          crate_metadata() {
            local package="$1" version="$2" output status
            output="$(mktemp)"
            status="$(curl --silent --show-error --retry 5 --retry-all-errors \
              --header "Authorization: Bearer ${CARGO_REGISTRY_TOKEN}" \
              --header 'User-Agent: hara-native-release' \
              --output "$output" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${package}/${version}")" || {
                rm -f "$output"
                return 2
              }
            case "$status" in
              200) cat "$output" ;;
              404) rm -f "$output"; return 1 ;;
              *)
                rm -f "$output"
                printf 'crates.io metadata request for %s %s returned HTTP %s\n' "$package" "$version" "$status" >&2
                return 2
                ;;
            esac
            rm -f "$output"
          }
          wait_for_crate() {
            local metadata
            for _ in $(seq 1 30); do
              if metadata="$(crate_metadata hara-native "$RELEASE_VERSION")"; then
                printf '%s' "$metadata"
                return 0
              fi
              test "$?" = 1 || return 1
              sleep 5
            done
            printf 'timed out waiting for hara-native %s on crates.io\n' "$RELEASE_VERSION" >&2
            return 1
          }
          version="$(cargo metadata --manifest-path core/rust/Cargo.toml --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "hara-native") | .version')"
          test "$version" = "$RELEASE_VERSION"
          package_for_registry
          expected="$(sha256sum "core/rust/target/package/hara-native-${version}.crate" | awk '{print $1}')"
          if metadata="$(crate_metadata hara-native "$version")"; then
            test "$RESUMING" = true
          else
            test "$?" = 1
            cargo publish --locked --manifest-path core/rust/Cargo.toml
            metadata="$(wait_for_crate)"
          fi
          checksum="$(jq -er '.version.checksum' <<<"$metadata")"
          test "$checksum" = "$expected"
          printf 'native_sha256=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

  verify-crates:
    needs: [release-ref, publish-native-crate]
    runs-on: ubuntu-22.04
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and execute the exact crates.io CLI release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/hara-native-install
        run: |
          set -euo pipefail
          cargo install --locked --version "$RELEASE_VERSION" --bin hara-native hara-native
          test "$("$CARGO_INSTALL_ROOT/bin/hara-native" --version)" = "hara-native ${RELEASE_VERSION}"

  publish-maven:
    needs: [release-ref, release-intent, jvm]
    runs-on: ubuntu-22.04
    environment: packages
    outputs:
      jar_sha256: ${{ steps.publish.outputs.jar_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hara-native-jvm
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - name: Import the Maven Central signing key
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_GPG_PRIVATE_KEY"
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons | grep -q '^sec:'
      - id: publish
        name: Publish or verify the exact Maven artifact
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          RESUMING: ${{ needs.release-intent.outputs.resuming }}
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
          mvn -q -f core/java/pom.xml -Djacoco.skip=true -DskipTests package
          jar="core/java/target/hara-native-jvm-${RELEASE_VERSION}.jar"
          release_jar="dist/hara-native-jvm-${RELEASE_VERSION}.jar"
          test "$(sha256sum "$jar" | awk '{print $1}')" = "$(sha256sum "$release_jar" | awk '{print $1}')"
          test -f "core/java/target/hara-native-jvm-${RELEASE_VERSION}-sources.jar"
          test -f "core/java/target/hara-native-jvm-${RELEASE_VERSION}-javadoc.jar"
          jar_contents="$(jar tf "$jar")"
          if grep -En '\.hal$|(^|/)hal-src/|std/foundation|tool/' <<<"$jar_contents"; then
            printf '%s contains source-owned payloads\n' "$jar" >&2
            exit 1
          fi
          url="https://repo.maven.apache.org/maven2/org/hara-lang/hara-native-jvm/${RELEASE_VERSION}/hara-native-jvm-${RELEASE_VERSION}.jar"
          published="$RUNNER_TEMP/hara-native-jvm-${RELEASE_VERSION}.jar"
          if curl --fail --silent --show-error --retry 5 --retry-all-errors --output "$published" "$url"; then
            test "$RESUMING" = true
          else
            mvn -q -f core/java/pom.xml -Djacoco.skip=true -DskipTests deploy
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --output "$published" "$url"
          fi
          test "$(sha256sum "$jar" | awk '{print $1}')" = "$(sha256sum "$published" | awk '{print $1}')"
          printf 'jar_sha256=sha256:%s\n' "$(sha256sum "$published" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  verify-maven:
    needs: [release-ref, publish-maven]
    runs-on: ubuntu-22.04
    environment: packages
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fetch and execute the exact Maven release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
          MAVEN_SHA256: ${{ needs.publish-maven.outputs.jar_sha256 }}
        run: |
          set -euo pipefail
          mvn -q dependency:get \
            -Dartifact="org.hara-lang:hara-native-jvm:${RELEASE_VERSION}" \
            -DremoteRepositories="central::default::https://repo.maven.apache.org/maven2"
          jar="$HOME/.m2/repository/org/hara-lang/hara-native-jvm/${RELEASE_VERSION}/hara-native-jvm-${RELEASE_VERSION}.jar"
          test "sha256:$(sha256sum "$jar" | awk '{print $1}')" = "$MAVEN_SHA256"
          test "$(java -jar "$jar" --version)" = "hara-native-jvm ${RELEASE_VERSION}"

  publish-npm:
    needs: [release-ref, release-intent, browser]
    runs-on: ubuntu-22.04
    environment: packages
    outputs:
      browser_integrity: ${{ steps.publish.outputs.browser_integrity }}
      hta_integrity: ${{ steps.publish.outputs.hta_integrity }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hara-native-browser
          path: core/rust/web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json
          registry-url: https://registry.npmjs.org
      - id: publish
        name: Publish or verify both public npm packages
        working-directory: core/rust/web
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RESUMING: ${{ needs.release-intent.outputs.resuming }}
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          for archive in dist/*.tgz; do
            archive_contents="$(tar -tzf "$archive")"
            if grep -En '\.hal$|(^|/)hal-src/|std\.foundation\.hbx$|cli\.hbx$' <<<"$archive_contents"; then
              printf '%s contains source-owned payloads\n' "$archive" >&2
              exit 1
            fi
          done
          npm_metadata() {
            local package="$1" version="$2" encoded output status
            encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$package")"
            output="$(mktemp)"
            status="$(curl --silent --show-error --retry 5 --retry-all-errors \
              --output "$output" --write-out '%{http_code}' \
              "https://registry.npmjs.org/${encoded}/${version}")" || {
                rm -f "$output"
                return 2
              }
            case "$status" in
              200) jq -er '.dist.integrity' "$output" ;;
              404) rm -f "$output"; return 1 ;;
              *)
                rm -f "$output"
                printf 'npm metadata request for %s %s returned HTTP %s\n' "$package" "$version" "$status" >&2
                return 2
                ;;
            esac
            rm -f "$output"
          }
          wait_for_npm() {
            local package="$1" version="$2" integrity
            for _ in $(seq 1 30); do
              if integrity="$(npm_metadata "$package" "$version")"; then
                printf '%s' "$integrity"
                return 0
              fi
              test "$?" = 1 || return 1
              sleep 5
            done
            printf 'timed out waiting for %s %s on npmjs\n' "$package" "$version" >&2
            return 1
          }
          local_integrity() {
            node -e 'const crypto = require("crypto"); const fs = require("fs"); process.stdout.write(`sha512-${crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64")}`);' "$1"
          }
          publish_or_resume() {
            local package="$1" archive="$2" output="$3" integrity expected
            test -f "$archive"
            expected="$(local_integrity "$archive")"
            if integrity="$(npm_metadata "$package" "$RELEASE_VERSION")"; then
              test "$RESUMING" = true
            else
              test "$?" = 1
              npm publish "$archive" --registry https://registry.npmjs.org --access public --provenance
              integrity="$(wait_for_npm "$package" "$RELEASE_VERSION")"
            fi
            test "$integrity" = "$expected"
            printf '%s=%s\n' "$output" "$integrity" >> "$GITHUB_OUTPUT"
          }
          publish_or_resume @hara-lang/native-browser "dist/hara-lang-native-browser-${RELEASE_VERSION}.tgz" browser_integrity
          publish_or_resume @hara-lang/hta "dist/hara-lang-hta-${RELEASE_VERSION}.tgz" hta_integrity

  verify-npm:
    needs: [release-ref, publish-npm]
    runs-on: ubuntu-22.04
    environment: packages
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install both exact npm releases in a fresh project
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hara-native-npm-release"
          mkdir -p "$work"
          cd "$work"
          npm init --yes >/dev/null
          npm install --ignore-scripts --package-lock=false --registry https://registry.npmjs.org \
            "@hara-lang/native-browser@${RELEASE_VERSION}" \
            "@hara-lang/hta@${RELEASE_VERSION}"
          node -e 'const fs = require("fs"); for (const name of ["native-browser", "hta"]) { const p = `node_modules/@hara-lang/${name}/package.json`; if (JSON.parse(fs.readFileSync(p)).version !== process.env.RELEASE_VERSION) process.exit(1); }'

  publish-container:
    needs: [release-ref, release-intent, preflight, publish-native-crate]
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Select immutable image identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - id: existing
        name: Detect an existing image tag
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          RESUMING: ${{ needs.release-intent.outputs.resuming }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            test "$RESUMING" = true
            digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" | awk '/Digest:/ {print $2; exit}')"
            test -n "$digest"
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi
      - id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: core/rust
          file: core/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.image.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
      - id: record
        name: Record the immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.existing.outputs.digest || steps.build.outputs.digest }}'
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  verify-container:
    needs: [release-ref, publish-container]
    runs-on: ubuntu-22.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and exercise the exact OCI release
        shell: bash
        env:
          IMAGE: ${{ needs.publish-container.outputs.image }}
          DIGEST: ${{ needs.publish-container.outputs.digest }}
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          test "$(docker run --rm "${IMAGE}@${DIGEST}" --version)" = "hara-native ${RELEASE_VERSION}"

  publish:
    name: finalize release
    needs: [release-ref, release-intent, rust-cli, jvm, browser, publish-crates, root-crate-package, publish-native-crate, verify-crates, publish-maven, verify-maven, publish-npm, verify-npm, publish-container, verify-container]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify payloads and write the release manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-ref.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-ref.outputs.commit }}
          ABI_SHA256: ${{ needs.publish-crates.outputs.abi_sha256 }}
          HTA_SHA256: ${{ needs.publish-crates.outputs.hta_sha256 }}
          MACROS_SHA256: ${{ needs.publish-crates.outputs.macros_sha256 }}
          NATIVE_SHA256: ${{ needs.publish-native-crate.outputs.native_sha256 }}
          MAVEN_SHA256: ${{ needs.publish-maven.outputs.jar_sha256 }}
          BROWSER_INTEGRITY: ${{ needs.publish-npm.outputs.browser_integrity }}
          HTA_INTEGRITY: ${{ needs.publish-npm.outputs.hta_integrity }}
          OCI_IMAGE: ${{ needs.publish-container.outputs.image }}
          OCI_DIGEST: ${{ needs.publish-container.outputs.digest }}
        run: |
          set -euo pipefail
          test -z "$(find . -path './examples' -prune -o -type f -name '*.hal' -print -quit)"
          for archive in dist/*.tar.gz dist/*.tgz; do
            archive_contents="$(tar -tzf "$archive")"
            if grep -En '\.hal$|(^|/)hal-src/|std\.foundation\.hbx$|cli\.hbx$' <<<"$archive_contents"; then
              printf '%s contains source-owned payloads\n' "$archive" >&2
              exit 1
            fi
          done
          jar_contents="$(jar tf "dist/hara-native-jvm-${RELEASE_VERSION}.jar")"
          if grep -En '\.hal$|(^|/)hal-src/|std/foundation|tool/' <<<"$jar_contents"; then
            printf '%s contains source-owned payloads\n' "dist/hara-native-jvm-${RELEASE_VERSION}.jar" >&2
            exit 1
          fi
          (cd dist && sha256sum * > SHA256SUMS)
          assets="$({
            while read -r checksum name; do
              size="$(wc -c < "dist/$name")"
              jq -n --arg name "$name" --arg sha256 "sha256:$checksum" --argjson size "$size" \
                '{name: $name, sha256: $sha256, size: $size}'
            done < dist/SHA256SUMS
          } | jq -s .)"
          jq \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$RELEASE_COMMIT" \
            --arg abi "$ABI_SHA256" \
            --arg hta_crate "$HTA_SHA256" \
            --arg macros "$MACROS_SHA256" \
            --arg native "$NATIVE_SHA256" \
            --arg maven "$MAVEN_SHA256" \
            --arg browser "$BROWSER_INTEGRITY" \
            --arg hta "$HTA_INTEGRITY" \
            --arg image "$OCI_IMAGE" \
            --arg digest "$OCI_DIGEST" \
            --argjson artifacts "$assets" \
            '. + {
              releaseTag: $tag,
              version: $version,
              commit: $commit,
              registries: {
                crates: [
                  {name: "hara-abi", version: $version, sha256: ("sha256:" + $abi)},
                  {name: "hara-hta", version: $version, sha256: ("sha256:" + $hta_crate)},
                  {name: "hara-protocol-macros", version: $version, sha256: ("sha256:" + $macros)},
                  {name: "hara-native", version: $version, sha256: ("sha256:" + $native)}
                ],
                maven: {coordinate: ("org.hara-lang:hara-native-jvm:" + $version), sha256: $maven},
                npm: [
                  {name: "@hara-lang/native-browser", version: $version, integrity: $browser},
                  {name: "@hara-lang/hta", version: $version, integrity: $hta}
                ],
                oci: {image: $image, digest: $digest}
              },
              artifacts: $artifacts
            }' release/compatibility.json > dist/release-manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-ref.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*
