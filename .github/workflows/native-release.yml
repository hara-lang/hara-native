name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  validate:
    uses: ./.github/workflows/native-host.yml

  release-version:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the tag and every distributable version to agree
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          test "${tag#v}" != "$tag"
          expected="${tag#v}"
          rust="$(cargo metadata --manifest-path core/rust/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hara-native") | .version')"
          jvm="$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="version"][1]/text()' core/java/pom.xml)"
          browser="$(node -p 'require("./core/rust/web/packages/browser/package.json").version')"
          hta="$(node -p 'require("./core/rust/web/packages/hta/package.json").version')"
          test "$rust" = "$expected"
          test "$jvm" = "$expected"
          test "$browser" = "$expected"
          test "$hta" = "$expected"

  rust-cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-22.04
          - id: macos-x86_64
            os: macos-13
          - id: macos-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path core/rust/Cargo.toml --release --bin hara-native
      - run: |
          mkdir -p dist
          tar -C core/rust/target/release -czf dist/hara-native-${{ matrix.id }}.tar.gz hara-native
      - uses: actions/upload-artifact@v4
        with:
          name: hara-native-${{ matrix.id }}
          path: dist/hara-native-${{ matrix.id }}.tar.gz
          if-no-files-found: error

  jvm:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q -f core/java/pom.xml -Djacoco.skip=true -DskipTests package
      - run: |
          mkdir -p dist
          cp core/java/target/hara-native-jvm-0.1.0.jar dist/hara-native-jvm-0.1.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: hara-native-jvm
          path: dist/hara-native-jvm-0.1.0.jar
          if-no-files-found: error

  browser:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build both browser host profiles
        run: make build-browser-profiles
      - name: Pack browser host packages
        working-directory: core/rust/web
        run: |
          mkdir -p dist
          (cd packages/browser && npm pack --pack-destination ../../dist)
          (cd packages/hta && npm pack --pack-destination ../../dist)
      - uses: actions/upload-artifact@v4
        with:
          name: hara-native-browser
          path: core/rust/web/dist/*.tgz
          if-no-files-found: error

  publish-maven:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validate, jvm, release-version]
    runs-on: ubuntu-22.04
    environment: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: hara-packages
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Verify the JAR before registry publication
        run: |
          set -euo pipefail
          mvn -q -f core/java/pom.xml -Djacoco.skip=true -DskipTests package
          ! jar tf core/java/target/hara-native-jvm-0.1.0.jar | rg -n '\\.hal$|(^|/)hal-src/|std/foundation|tool/'
      - run: mvn -q -f core/java/pom.xml -Djacoco.skip=true -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.PACKAGES_MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_MAVEN_PASSWORD }}

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validate, browser, release-version]
    runs-on: ubuntu-22.04
    environment: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json
          registry-url: https://packages.hara-lang.org/npm/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build both browser host profiles
        run: make build-browser-profiles
      - name: Publish browser host packages
        working-directory: core/rust/web
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd packages/browser && npm pack --pack-destination ../../dist)
          (cd packages/hta && npm pack --pack-destination ../../dist)
          for archive in dist/*.tgz; do
            ! tar -tzf "$archive" | rg -n '\\.hal$|(^|/)hal-src/|std\.foundation\.hbx$|cli\.hbx$'
          done
          npm publish --workspace @hara-lang/native-browser
          npm publish --workspace @hara-lang/hta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_NPM_TOKEN }}

  publish-crates:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validate, release-version]
    runs-on: ubuntu-22.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require crates.io publication authority
        run: test -n "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish repository-owned Cargo packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          publish_if_missing() {
            local manifest="$1"
            local package="$2"
            local version
            version="$(cargo metadata --manifest-path "$manifest" --no-deps --format-version 1 | jq -r --arg package "$package" '.packages[] | select(.name == $package) | .version')"
            if curl --fail --silent --show-error "https://crates.io/api/v1/crates/${package}/${version}" >/dev/null; then
              echo "${package} ${version} is already published"
            else
              cargo publish --manifest-path "$manifest" --locked
            fi
          }
          publish_if_missing core/rust/crates/abi/Cargo.toml hara-abi
          publish_if_missing core/rust/crates/protocol-macros/Cargo.toml hara-protocol-macros
          publish_if_missing core/rust/Cargo.toml hara-native

  publish-container:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [publish-crates, release-version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Select immutable image identity
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: core/rust
          file: core/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.image.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
      - name: Record the published OCI digest
        run: |
          mkdir -p dist
          printf '%s@%s\n' '${{ steps.image.outputs.name }}' '${{ steps.build.outputs.digest }}' \
            > dist/hara-native-container.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hara-native-container
          path: dist/hara-native-container.txt
          if-no-files-found: error

  verify-container:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [publish-container, release-version]
    runs-on: ubuntu-22.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and exercise the released executable image
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${version}"
          docker pull "$image"
          test "$(docker run --rm "$image" --version)" = "hara-native ${version}"

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust-cli, jvm, browser, release-version, publish-maven, publish-npm, publish-crates, verify-container]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify release payload and write checksums
        run: |
          set -euo pipefail
          test -z "$(find . -type f -name '*.hal' -print -quit)"
          for archive in dist/*.tar.gz dist/*.tgz; do
            ! tar -tzf "$archive" | rg -n '\\.hal$|(^|/)hal-src/|std\.foundation\.hbx$|cli\.hbx$'
          done
          ! jar tf dist/hara-native-jvm-0.1.0.jar | rg -n '\\.hal$|(^|/)hal-src/|std/foundation|tool/'
          (cd dist && sha256sum * > SHA256SUMS)
          assets="$({
            while read -r checksum name; do
              size="$(wc -c < "dist/$name")"
              jq -n --arg name "$name" --arg sha256 "sha256:$checksum" --argjson size "$size" \
                '{name: $name, sha256: $sha256, size: $size}'
            done < dist/SHA256SUMS
          } | jq -s .)"
          tag="${{ inputs.tag || github.ref_name }}"
          jq --arg tag "$tag" --argjson artifacts "$assets" \
            '. + {releaseTag: $tag, artifacts: $artifacts}' \
            release/compatibility.json > dist/release-manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
