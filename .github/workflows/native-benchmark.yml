name: Native benchmark evidence

on:
  # Full benchmark evidence is collected only for a versioned release candidate.
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: guard
        type: choice
        options: [smoke, guard, standard]

permissions:
  contents: read

jobs:
  benchmark:
    name: native tiers (${{ inputs.profile || 'standard' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HARA_BENCH_CONTAINER_IMAGE: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            value="${{ inputs.profile }}"
          else
            value=standard
          fi
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"
      - name: Build workers and collect same-run evidence
        run: make benchmark-native PROFILE=${{ steps.profile.outputs.value }}
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          evidence="core/rust/target/native-benchmark/evidence-${{ steps.profile.outputs.value }}.json"
          printf '## Native benchmark evidence (%s)\n\n' "${{ steps.profile.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$evidence" ]; then
            jq -r '
              "Schema: `\(.schema)`  \nCorpus: `\(.corpus.id)`  \nComparability: `\(.protocol.comparability)`\n\n| Tier | Workload | p50 ns | p95 ns | CV ppm | Native entry |\n|---|---:|---:|---:|---:|---:|",
              (.measurements[] |
                "| \(.tier) | \(.workload) | \(.analysis.p50_ns) | \(.analysis.p95_ns) | \(.analysis.cv_ppm) | \(if .native_entry == null then "n/a" else (.native_entry | tostring) end) |")
            ' "$evidence" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No evidence file was produced. See the failed benchmark step.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-benchmark-${{ steps.profile.outputs.value }}
          path: core/rust/target/native-benchmark/evidence-${{ steps.profile.outputs.value }}.json
          if-no-files-found: warn
          retention-days: 90
