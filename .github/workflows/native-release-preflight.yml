name: Native release preflight

on:
  workflow_call:
  pull_request:
    branches: [release]
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  release-origin:
    name: release origin and lineage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release pull requests to promote a descendant of main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != pull_request ]; then
            exit 0
          fi
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.pull_request.head.ref }}" = main
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "$base" "$head"
          # A one-time re-anchor leaves release directly on a main commit. Later
          # GitHub merge commits keep the prior release as their first parent and
          # the promoted main commit as their second, so release itself is no
          # longer an ancestor of the next main head.
          if git merge-base --is-ancestor "$base" "$head"; then
            exit 0
          fi
          parents="$(git show -s --format=%P "$base")"
          read -r -a parents <<<"$parents"
          test "${#parents[@]}" = 2
          git merge-base --is-ancestor "${parents[0]}" "${parents[1]}"
          git merge-base --is-ancestor "${parents[1]}" "$head"

  validate:
    needs: release-origin
    uses: ./.github/workflows/native-host.yml

  release-contract:
    name: release contract
    needs: release-origin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the canonical version contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.format' release/version.json)" = hara-native/release-version-v1
          version="$(jq -er '.version' release/version.json)"
          node -e 'const version = process.argv[1]; if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(version)) process.exit(1)' "$version"
          expect() {
            local label="$1"
            local actual="$2"
            if [ "$actual" != "$version" ]; then
              printf '%s version is %s; expected %s\\n' "$label" "$actual" "$version" >&2
              exit 1
            fi
          }
          cargo_version() {
            cargo metadata --manifest-path "$1" --no-deps --format-version 1 | jq -er --arg package "$2" '.packages[] | select(.name == $package) | .version'
          }
          pom_version() {
            node -e 'const pom = require("fs").readFileSync(process.argv[1], "utf8"); const match = pom.match(/<project\b[\s\S]*?<version>([^<]+)<\/version>/); if (!match) process.exit(1); process.stdout.write(match[1]);' "$1"
          }
          expect hara-abi "$(cargo_version core/rust/crates/abi/Cargo.toml hara-abi)"
          expect hara-hta "$(cargo_version core/rust/crates/hta-codec/Cargo.toml hara-hta)"
          expect hara-protocol-macros "$(cargo_version core/rust/crates/protocol-macros/Cargo.toml hara-protocol-macros)"
          expect hara-native "$(cargo_version core/rust/Cargo.toml hara-native)"
          expect hara-native-jvm "$(pom_version core/java/pom.xml)"
          expect native-browser "$(node -p 'require("./core/rust/web/packages/browser/package.json").version')"
          expect hta "$(node -p 'require("./core/rust/web/packages/hta/package.json").version')"
          expect compatibility "$(jq -er '.nativeVersion' release/compatibility.json)"
          expect jvm-cli "$(node -e 'const source = require("fs").readFileSync(process.argv[1], "utf8"); const match = source.match(/hara-native-jvm\s+([0-9A-Za-z.+-]+)/); if (!match) process.exit(1); process.stdout.write(match[1]);' core/java/src/main/java/hara/kernel/NativeMain.java)"
          expect jvm-resp "$(node -e 'const source = require("fs").readFileSync(process.argv[1], "utf8"); const match = source.match(/"VERSION"\s*,\s*"([0-9A-Za-z.+-]+)"/); if (!match) process.exit(1); process.stdout.write(match[1]);' core/java/src/main/java/hara/truffle/HaraServer.java)"
          test "$(node -p 'require("./core/rust/web/packages/browser/package.json").dependencies["@hara-lang/hta"]')" = "$version"
          test "$(node -p 'require("./core/rust/web/package.json").dependencies["@hara-lang/hta"]')" = "$version"
          test "$(node -p 'require("./core/rust/web/packages/db-sqlite/package.json").dependencies["@hara-lang/hta"]')" = "$version"
          test "$(jq -er '.sourceOwnership.packageRegistry.maven' release/compatibility.json)" = https://repo.maven.apache.org/maven2
          test "$(jq -er '.sourceOwnership.packageRegistry.npm' release/compatibility.json)" = https://registry.npmjs.org
          grep -q '<id>central</id>' core/java/pom.xml
          grep -q '<artifactId>central-publishing-maven-plugin</artifactId>' core/java/pom.xml
          test "$(node -p 'require("./core/rust/web/packages/browser/package.json").publishConfig.registry')" = https://registry.npmjs.org
          test "$(node -p 'require("./core/rust/web/packages/hta/package.json").publishConfig.registry')" = https://registry.npmjs.org

  cargo-package:
    name: cargo package
    needs: release-contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package the public crates without local source dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo package --manifest-path core/rust/crates/abi/Cargo.toml --allow-dirty --no-verify
          cargo package --manifest-path core/rust/crates/protocol-macros/Cargo.toml --allow-dirty --no-verify
          # hara-hta and hara-native resolve the new release versions from
          # crates.io. Their exact packages are checked in dependency order by
          # the promotion workflow after each dependency is published.
          version="$(jq -er '.version' release/version.json)"
          for crate in hara-abi hara-protocol-macros; do
            manifest="$(tar -tzf "core/rust/target/package/${crate}-${version}.crate" | grep '/Cargo.toml$')"
            manifest_contents="$(tar -xOf "core/rust/target/package/${crate}-${version}.crate" "$manifest")"
            if grep -En '= \{[^}]*[[:space:],{](path|git)[[:space:]]*=' <<<"$manifest_contents"; then
              printf '%s contains a local or git dependency\n' "$crate" >&2
              exit 1
            fi
          done

  jvm-package:
    name: jvm package
    needs: release-contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and inspect the versioned JVM artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.version' release/version.json)"
          mvn -q -f core/java/pom.xml -Djacoco.skip=true -DskipTests package
          jar="core/java/target/hara-native-jvm-${version}.jar"
          test -f "$jar"
          test -f "core/java/target/hara-native-jvm-${version}-sources.jar"
          test -f "core/java/target/hara-native-jvm-${version}-javadoc.jar"
          jar_contents="$(jar tf "$jar")"
          if grep -En '\.hal$|(^|/)hal-src/|std/foundation|tool/' <<<"$jar_contents"; then
            printf '%s contains source-owned payloads\n' "$jar" >&2
            exit 1
          fi
          test "$(java -jar "$jar" --version)" = "hara-native-jvm ${version}"

  browser-package:
    name: browser package
    needs: release-contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build, pack, and inspect public browser packages
        shell: bash
        run: |
          set -euo pipefail
          make build-browser-profiles
          version="$(jq -er '.version' release/version.json)"
          mkdir -p core/rust/web/dist
          (cd core/rust/web/packages/browser && npm pack --pack-destination ../../dist)
          (cd core/rust/web/packages/hta && npm pack --pack-destination ../../dist)
          test -f "core/rust/web/dist/hara-lang-native-browser-${version}.tgz"
          test -f "core/rust/web/dist/hara-lang-hta-${version}.tgz"
          for archive in core/rust/web/dist/*.tgz; do
            archive_contents="$(tar -tzf "$archive")"
            if grep -En '\.hal$|(^|/)hal-src/|std\.foundation\.hbx$|cli\.hbx$' <<<"$archive_contents"; then
              printf '%s contains source-owned payloads\n' "$archive" >&2
              exit 1
            fi
          done

  container-package:
    name: container package
    needs: release-contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --check --file core/rust/Dockerfile core/rust

  release-ready:
    name: release ready
    if: always()
    needs: [release-origin, validate, release-contract, cargo-package, jvm-package, browser-package, container-package]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every release gate
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.release-origin.result }}' = success
          test '${{ needs.validate.result }}' = success
          test '${{ needs.release-contract.result }}' = success
          test '${{ needs.cargo-package.result }}' = success
          test '${{ needs.jvm-package.result }}' = success
          test '${{ needs.browser-package.result }}' = success
          test '${{ needs.container-package.result }}' = success
